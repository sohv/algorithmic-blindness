[project]
name = "algorithmic-blindness"
version = "0.1.0"
description = "Can LLMs predict how causal discovery algorithms actually perform?"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # shared
    "numpy",
    "pandas<3",
    "scipy",
    "pyyaml",
    "tqdm",
    "joblib",
    "simple-parsing",
    "python-dotenv",
    "matplotlib",
    "seaborn",
    # causal discovery: the algorithms whose behaviour the llms are asked to predict
    "lingam",
    "category_encoders",
    "graphviz",
    "causal-learn",
    "networkx",
    "pgmpy",
    "bnlearn",
    "scikit-learn",
    "lightgbm",
    "notears-pytorch",
    # every model is reached through openrouter's openai-compatible endpoint
    "openai",
    "requests",
    # results mirror
    "huggingface-hub",
    # markdown tables in results/RESULTS.md
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "ruff",
    "nbstripout",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "E402", "E741", "F841", "F403", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
